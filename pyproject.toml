[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "onlylab"
version = "0.1.0"
description = "Build tamper-evident evidence capsules from URLs, repositories, and files without executing untrusted code."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Only"}]
keywords = ["evidence", "provenance", "reproducibility", "forensics", "research"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
only = "onlylab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
