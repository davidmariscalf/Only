[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "onlylab"
version = "0.2.0"
description = "Build bounded evidence capsules from public URLs, repositories, and local files without executing target-controlled code."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "David Mariscal Fernández"}]
keywords = ["evidence", "provenance", "reproducibility", "forensics", "research"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
only = "onlylab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
