name: Only Capture

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Capture kind
        required: true
        type: choice
        options: [url, repo]
      target:
        description: Public HTTP(S) URL or repository URL
        required: true
        type: string
      label:
        description: Optional artifact label
        required: false
        type: string
  issues:
    types: [opened]

permissions: {}

env:
  GIT_ASKPASS: /bin/false
  SSH_ASKPASS: /bin/false
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""

jobs:
  capture-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Capture
        id: capture
        env:
          KIND: ${{ inputs.kind }}
          TARGET: ${{ inputs.target }}
          LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail
          if [ "$KIND" = "repo" ]; then
            if [ -n "$LABEL" ]; then PYTHONPATH=src python -m onlylab.cli repo "$TARGET" --label "$LABEL"; else PYTHONPATH=src python -m onlylab.cli repo "$TARGET"; fi
          else
            if [ -n "$LABEL" ]; then PYTHONPATH=src python -m onlylab.cli url "$TARGET" --label "$LABEL"; else PYTHONPATH=src python -m onlylab.cli url "$TARGET"; fi
          fi | tee /tmp/only-output.txt
          DIGEST="$(sed -n 's/^manifest_sha256=//p' /tmp/only-output.txt | tail -n 1)"
          test "${#DIGEST}" -eq 64
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "### Only capture" >> "$GITHUB_STEP_SUMMARY"
          echo "\`manifest_sha256=$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: artifact
        with:
          name: only-capture-${{ github.run_id }}
          path: captures/
          if-no-files-found: error
          retention-days: 30
      - name: Record artifact digest
        run: echo "artifact_digest=${{ steps.artifact.outputs.artifact-digest }}" >> "$GITHUB_STEP_SUMMARY"

  capture-issue:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[only]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Capture from owner issue
        id: capture
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m onlylab.issue "$ISSUE_BODY" | tee /tmp/only-output.txt
          DIGEST="$(sed -n 's/^manifest_sha256=//p' /tmp/only-output.txt | tail -n 1)"
          test "${#DIGEST}" -eq 64
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: artifact
        with:
          name: only-capture-${{ github.run_id }}
          path: captures/
          if-no-files-found: error
          retention-days: 30
      - name: Comment run link and integrity anchors
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          MANIFEST_DIGEST: ${{ steps.capture.outputs.digest }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: >-
          gh issue comment "$ISSUE" --body "Capture created. Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} | manifest_sha256=$MANIFEST_DIGEST | artifact_digest=$ARTIFACT_DIGEST"
